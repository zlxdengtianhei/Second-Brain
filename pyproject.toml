[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain"
version = "0.1.0"
description = "Turn inbox material into reviewable atomic cards with independent review, taxonomy and MOCs for Obsidian"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
api = ["httpx>=0.27,<1"]
mcp = ["mcp==2.2.0"]
review = ["fsrs==6.3.2"]
test = ["pytest>=8"]

[project.scripts]
sb = "secondbrain.cli:main"
secondbrain = "secondbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secondbrain = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
