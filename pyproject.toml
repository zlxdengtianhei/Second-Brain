[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain"
version = "0.1.0"
description = "Turn inbox material into reviewable atomic cards with independent review, taxonomy and MOCs for Obsidian"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
api = ["httpx>=0.27,<1"]
mcp = ["mcp==2.2.0"]
review = ["fsrs==6.3.2"]
curate = ["networkx>=3.5,<4"]
export = ["markdown>=3.5,<4", "pymdown-extensions>=10,<13"]
test = ["pytest>=8", "httpx>=0.27,<1", "fsrs==6.3.2", "mcp==2.2.0", "networkx>=3.5,<4", "markdown>=3.5,<4",
        "pymdown-extensions>=10,<13"]

[project.scripts]
sb = "secondbrain.cli:main"
secondbrain = "secondbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secondbrain = ["prompts/*.md", "export/mathjax_check.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
