name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The diagram tests render Mermaid with the build Obsidian ships, in headless Chrome.
      - name: Install tools/mermaid_check
        working-directory: tools/mermaid_check
        run: npm ci
      # Ubuntu 24.04 blocks the Chrome sandbox's user namespaces by default.
      - name: Allow the Chrome sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Install the package
        run: python -m pip install -e ".[test]"
      - name: Run pytest
        env:
          MERMAID_CHECK_BROWSER: /usr/bin/google-chrome
        run: python -m pytest -q

  plugin:
    name: Obsidian plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
