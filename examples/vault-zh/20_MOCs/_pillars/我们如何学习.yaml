title: 我们如何学习
narrative: >-
  记忆会按可以预测的方式衰退，工作记忆一次只能装下少量东西。顺应这些限制的学习方法，
  比如间隔复习、用回忆代替重读，能让知识留得更久。
pillars:
  - name: 记忆
    order: 1
    why: 学到的东西随时间会怎样，我们一次能装下多少。
    topics:
      - 遗忘
      - 工作记忆
  - name: 学习策略
    order: 2
    why: 哪些学习方式能带来持久的知识。
    topics:
      - 间隔
      - 提取
      - 练习设计
  - name: 教学呈现
    order: 3
    why: 材料的呈现方式怎样影响学习者能吸收多少。
    topics:
      - 认知负荷
