title: 计算基础
narrative: >-
  程序快，是因为它少做事：耗时随输入增长得慢，用哈希或折半直接找到数据，
  把常用的数据放在缓存里。
pillars:
  - name: 算法
    order: 1
    why: 一种方法的代价怎样随输入增长。
    topics:
      - 复杂度
      - 查找
  - name: 数据结构
    order: 2
    why: 数据的组织方式决定哪些操作便宜。
    topics:
      - 哈希
      - 概率型结构
  - name: 系统
    order: 3
    why: 真实的机器怎样用快的存储挡在慢的存储前面。
    topics:
      - 缓存
