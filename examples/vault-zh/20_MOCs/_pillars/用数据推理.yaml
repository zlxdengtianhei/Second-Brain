title: 用数据推理
narrative: >-
  数据里既有信号，也有偶然和偏差。概率告诉我们怎样用证据更新判断，抽样方式决定数据能说明什么，
  推断说明我们能有多大把握。
pillars:
  - name: 概率
    order: 1
    why: 怎样对不确定的事件做推理，并用证据更新判断。
    topics:
      - 条件概率
      - 贝叶斯推理
  - name: 数据收集
    order: 2
    why: 收集数据的方式怎样限制数据能说明的东西。
    topics:
      - 抽样偏差
      - 偶然与波动
  - name: 推断
    order: 3
    why: 怎样说明数据支持什么，以及有多大把握。
    topics:
      - 估计
      - 假设检验
